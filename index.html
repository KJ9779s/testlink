<!DOCTYPE html>
<html lang="zh-TW">
	<head>
		<meta charset="UTF-8">
			<meta name="viewport" content="width=device-width, initial-scale=1.0">
				<title>KOKO MUSIC</title>
				<link rel="stylesheet" href="style.css">
					<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
	<body>
		<video id="bg-video" autoplay="" loop="" muted="" playsinline="" preload="auto">
			<source src="" type="video/mp4">
    </video>

		<div id="content-area">
			<div id="home-view" class="view">
				<h1>所有歌曲</h1>
				<ul id="home-list" class="music-grid"></ul>
			</div>
			<div id="library-view" class="view" style="display:none;">
				<h1>喜愛歌曲</h1>
				<ul id="library-list" class="music-grid"></ul>
			</div>
		</div>

		<div id="bottom-player" onclick="togglePlayerView()">
			<img src="" id="mini-img" alt="Cover">
				<div class="mini-info">
					<p id="mini-name">選擇一首歌</p>
				</div>
				<i id="mini-play" class="fas fa-play"></i>
			</div>

		<div id="full-player">
			<div class="player-card">
				<div class="player-header">
					<button onclick="togglePlayerView()">
						<i class="fas fa-chevron-down"></i>
					</button>
					<p>正在播放</p>
					<button id="view-switch-btn" onclick="toggleLyricsView()">
						<i class="fas fa-list-ul"></i>
					</button>
				</div>
				<div class="main-view-container">
					<div id="cover-view" class="active-view">
						<div class="img-area">
							<img src="" alt="Cover" id="main-img">
						</div>
						<div class="song-details">
							<p class="name"></p>
							<p class="artist"></p>
						</div>
					</div>
					<div id="lyrics-view" class="inactive-view">
						<div class="lyrics-area">
							<div id="lyrics-wrapper"></div>
						</div>
					</div>
				</div>
				<!-- 進度條區塊：解決 script.js 錯誤的核心 -->
				<div class="progress-container">
					<div class="progress-bar"></div>
				</div>
			</div>
		</div>

		<nav class="bottom-nav">
			<a href="#" onclick="showView('home')">
				<i class="fas fa-home"></i>
				<br>首頁
			</a>
			<a href="#" onclick="showView('library')">
				<i class="fas fa-music"></i>
				<br>音樂庫
			</a>
		</nav>

		<script src="data.js"></script>
		<script src="lyrics.js"></script>
		<script src="script.js"></script>
	</body>
</html>
